name: Release

# Every push to main validates the pack. When `version` in pack.toml is new
# (no v<version> tag yet), it exports a CurseForge .zip and a Modrinth .mrpack,
# attaches both to a GitHub release, and (once configured) uploads the .zip to
# CurseForge. To publish: bump version in pack.toml, run `packwiz refresh`, push.
#
# CurseForge setup (one time):
#   Settings > Secrets and variables > Actions
#     Secret   CURSEFORGE_TOKEN       - API token from curseforge.com account settings
#     Variable CURSEFORGE_PROJECT_ID  - numeric ID of the "Cursed Arts" modpack project

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Work out version
        id: ver
        run: |
          v=$(grep -m1 '^version' pack.toml | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi

      - name: Check index is up to date
        run: |
          packwiz refresh
          git diff --exit-code -- index.toml pack.toml || { echo "::error::Run 'packwiz refresh' and commit the result"; exit 1; }

      - name: Export
        run: |
          packwiz curseforge export -o "Cursed-Arts-${{ steps.ver.outputs.version }}.zip"
          packwiz modrinth export -o "Cursed-Arts-${{ steps.ver.outputs.version }}.mrpack"

      - uses: actions/upload-artifact@v4
        with:
          name: cursed-arts-${{ steps.ver.outputs.version }}
          path: |
            *.zip
            *.mrpack

      - name: GitHub release
        if: steps.ver.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Cursed Arts ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            Cursed-Arts-${{ steps.ver.outputs.version }}.zip
            Cursed-Arts-${{ steps.ver.outputs.version }}.mrpack
          generate_release_notes: true

      - name: Upload to CurseForge
        if: steps.ver.outputs.new == 'true' && env.CF_TOKEN != '' && vars.CURSEFORGE_PROJECT_ID != ''
        uses: itsmeow/curseforge-upload@v3
        with:
          token: ${{ secrets.CURSEFORGE_TOKEN }}
          project_id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          game_endpoint: minecraft
          file_path: Cursed-Arts-${{ steps.ver.outputs.version }}.zip
          display_name: Cursed Arts ${{ steps.ver.outputs.version }}
          game_versions: "Minecraft 1.21:1.21.1"
          release_type: release
          changelog: "See https://github.com/${{ github.repository }}/releases/tag/v${{ steps.ver.outputs.version }}"
